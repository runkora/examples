# The platform team's repository for the multi-tenant example: one tenant per
# team and the models every tenant can use. Each team keeps its own repository,
# ../engineering and ../sre.
#
# These resources span kora-system and the cluster scope. This file sets no
# namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  # The console shows this value as "Managed by" on each declared item.
  runkora.io/repository: github.com/runkora/examples
resources:
  - tenants/engineering.yaml
  - tenants/sre.yaml
  - models/claude-haiku-5-5.yaml
  - models/deepseek-v4-1-flash.yaml
  - models/gpt-6-luna.yaml
  - models/gpt-oss-20b.yaml
