# The GitHub organisation's webhook. Set the organisation webhook URL to the
# API host plus status.webhookPath, and its secret to the signing secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-org-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: example-secret-store
  target:
    name: github-org-webhook
    template:
      metadata:
        labels:
          # kora reads only Secrets that carry this label.
          runkora.io/trigger-source: "true"
  data:
    - secretKey: secret
      remoteRef:
        key: engineering-github-webhook
        property: secret
---
apiVersion: runkora.io/v1alpha1
kind: TriggerSource
metadata:
  name: github-org
spec:
  provider: github
  signingSecretRef:
    name: github-org-webhook
    key: secret
