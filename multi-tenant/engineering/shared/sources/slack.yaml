# The Slack app's event subscription. Slack issues the signing secret. Store
# it under the remote key below.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-webhook
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: example-secret-store
  target:
    name: slack-webhook
    template:
      metadata:
        labels:
          # kora reads only Secrets that carry this label.
          runkora.io/trigger-source: "true"
  data:
    - secretKey: secret
      remoteRef:
        key: engineering-slack-webhook
        property: secret
---
apiVersion: runkora.io/v1alpha1
kind: TriggerSource
metadata:
  name: slack
spec:
  provider: slack
  signingSecretRef:
    name: slack-webhook
    key: secret
