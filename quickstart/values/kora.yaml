# kora chart overrides for the quickstart. Anything not set here is the chart
# default (helm show values oci://ghcr.io/runkora/charts/kora). The Makefile sets
# global.trustDomain.
global:
  logFormat: console
  postgres:
    # The in-cluster Postgres in manifests/data serves plaintext.
    sslMode: disable

# Every *.localhost name resolves to your machine, and browsers treat it as a
# secure origin over plain HTTP. The console is http://kora.localhost:9880 and
# the API is api.kora.localhost. No certificate is needed.
frontendHost: kora.localhost

frontend:
  config:
    # The chart builds this URL from frontendHost on the standard HTTPS port.
    # The quickstart serves plain HTTP on port 9880, so it sets the URL itself.
    nextPublicAppUrl: http://kora.localhost:9880

config:
  db:
    host: postgres.kora-data.svc.cluster.local
  redis:
    host: redis.kora-data.svc.cluster.local
    tls:
      # The in-cluster Redis in manifests/data serves plaintext.
      enabled: false

networkPolicy:
  # kora-system is default-deny. These entries open the ports kora needs
  # beyond the defaults.
  externalServices:
    # The k3s pod network: Postgres, Redis and Dex.
    - cidr: 10.42.0.0/16
      ports: [5432, 6379, 5557]
    # Ollama on your machine, reached at host.k3d.internal. Used only by the
    # Ollama provider in providers/ollama.yaml.
    - cidr: 0.0.0.0/0
      ports: [11434]

egressGateway:
  # The sre example's cluster connection reaches the k3d API server, which
  # listens on 6443.
  upstreamPorts:
    - 6443

identity:
  # Inside the cluster this alias points dex.localhost at the fixed ClusterIP
  # of the Dex Service in manifests/dex/dex.yaml.
  hostAliases:
    - ip: 10.43.200.10
      hostnames:
        - dex.localhost

# The quickstart runs one operator replica, with no leader election and no
# disruption budget.
operator:
  replicas: 1
  leaderElection: false
  podDisruptionBudget:
    enabled: false
