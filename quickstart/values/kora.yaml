# kora chart overrides for the quickstart. Anything not set here is the chart
# default (helm show values oci://ghcr.io/runkora/charts/kora). The Makefile sets
# global.trustDomain.
global:
  logFormat: console
  postgres:
    # The in-cluster Postgres in manifests/data serves plaintext.
    sslMode: disable

# *.local.runkora.io is a public DNS record that resolves to 127.0.0.1. The
# console is https://local.runkora.io:9443 and the API is api.local.runkora.io.
frontendHost: local.runkora.io

frontend:
  config:
    nextPublicAppUrl: https://local.runkora.io:9443

config:
  db:
    host: postgres.kora-data.svc.cluster.local
  redis:
    host: redis.kora-data.svc.cluster.local
    tls:
      # The in-cluster Redis in manifests/data serves plaintext.
      enabled: false

networkPolicy:
  # kora-system is default-deny. These entries open the ports kora needs
  # beyond the defaults.
  externalServices:
    # The k3s pod network: Postgres, Redis and Dex.
    - cidr: 10.42.0.0/16
      ports: [5432, 6379, 5557]
    # Ollama on your machine, reached at host.k3d.internal. Used only by the
    # Ollama provider in providers/ollama.yaml.
    - cidr: 0.0.0.0/0
      ports: [11434]

egressGateway:
  # The sre example's cluster connection reaches the k3d API server, which
  # listens on 6443.
  upstreamPorts:
    - 6443

gateway:
  tls:
    enabled: true
    # make secrets creates this from the mkcert certificate for *.local.runkora.io.
    credentialName: kora-gateway-tls

identity:
  # Inside the cluster dex.local.runkora.io resolves to 127.0.0.1. This alias
  # points it at the fixed ClusterIP of the Dex Service in manifests/dex/dex.yaml.
  hostAliases:
    - ip: 10.43.200.10
      hostnames:
        - dex.local.runkora.io
  # Dex serves a certificate from the mkcert CA. The identity service trusts
  # that CA alongside the system roots to verify Dex's tokens over TLS.
  extraEnv:
    - name: SSL_CERT_DIR
      value: /etc/ssl/certs:/etc/kora/local-ca
  extraVolumes:
    - name: local-ca
      configMap:
        name: local-ca
  extraVolumeMounts:
    - name: local-ca
      mountPath: /etc/kora/local-ca
      readOnly: true

# The quickstart runs one operator replica, with no leader election and no
# disruption budget.
operator:
  replicas: 1
  leaderElection: false
  podDisruptionBudget:
    enabled: false
