# The local cluster: one server node and two agent nodes. The Makefile passes
# the k3s image from versions.mk.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: kora-quickstart
servers: 1
agents: 2

ports:
  # The kora gateway. The console is http://kora.localhost:9880.
  - port: 9880:80
    nodeFilters:
      - loadbalancer
  # Dex, the sign-in provider. The browser and the identity service both use
  # http://dex.localhost:5557/dex.
  - port: 5557:5557
    nodeFilters:
      - loadbalancer

options:
  k3s:
    extraArgs:
      # k3s installs Traefik as its default ingress controller. kora does not
      # use it, and it would hold ports 80 and 443 that kora's Istio ingress
      # gateway needs.
      - arg: --disable=traefik
        nodeFilters:
          - server:*
