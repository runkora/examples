# The secret store the examples read from. Their ExternalSecret resources name
# example-secret-store and a key. In production the store points at your
# secret manager, such as AWS Secrets Manager or Vault. On the quickstart it
# reads the Secrets that make credentials writes into kora-credentials. The
# examples run unchanged on both.
#
# Each remoteRef.key is a Secret name in kora-credentials, and each
# remoteRef.property is a key in that Secret.
#
# This one store serves every tenant to keep the example install simple. Any
# namespace can read any key through it, including another tenant's
# credentials. In a real install, give each tenant its own store: a
# ClusterSecretStore whose spec.conditions match only that tenant's namespace,
# with a reader that can reach only that tenant's keys.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: example-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: kora-credentials
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
          namespace: kora-credentials
      auth:
        serviceAccount:
          name: credentials-reader
          namespace: kora-credentials
---
# The identity the store reads kora-credentials as. It can read Secrets in
# that namespace only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: credentials-reader
  namespace: kora-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: credentials-reader
  namespace: kora-credentials
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: credentials-reader
  namespace: kora-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: credentials-reader
subjects:
  - kind: ServiceAccount
    name: credentials-reader
    namespace: kora-credentials
