# glauth is a small LDAP directory that holds the quickstart's users and groups.
# kora reads a person's roles from the groups claim in their ID token. Dex's
# built-in password database has no groups. Dex reads its users from glauth.
#
# Every tenant in the examples claims the local.runkora.io domain and binds to
# one tenant group in the groups claim. kora signs a person in to the tenant
# whose group they are in. Each user is in exactly one tenant group.
#
# Every user has the password "password" (passsha256 is its SHA-256).
#   admin@local.runkora.io                 example       platform-admin, engineer
#   engineer@local.runkora.io              example       engineer, kora-viewer
#   engineering-admin@local.runkora.io     engineering   platform-admin
#   engineering-dev@local.runkora.io       engineering   reviewer, kora-viewer
#   sre-admin@local.runkora.io             sre           platform-admin
#   sre-oncall@local.runkora.io            sre           sre, kora-viewer
#   autofix-admin@local.runkora.io         autofix       platform-admin
#   autofix-maintainer@local.runkora.io    autofix       maintainer
#   oncall-admin@local.runkora.io          oncall        platform-admin
#   oncall-sre@local.runkora.io            oncall        sre
#   feature-admin@local.runkora.io         feature       platform-admin
#   feature-maintainer@local.runkora.io    feature       maintainer
apiVersion: v1
kind: ConfigMap
metadata:
  name: glauth
  namespace: dex
data:
  config.cfg: |
    [ldap]
      enabled = true
      listen = "0.0.0.0:3893"
    [ldaps]
      enabled = false
    [backend]
      datastore = "config"
      baseDN = "dc=kora,dc=local"

    # Dex binds as this account to search users and groups.
    [[users]]
      name = "serviceuser"
      mail = "service@local.runkora.io"
      uidnumber = 5000
      primarygroup = 5000
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"
      [[users.capabilities]]
        action = "search"
        object = "*"

    [[users]]
      name = "admin"
      givenname = "Admin"
      sn = "User"
      mail = "admin@local.runkora.io"
      uidnumber = 1001
      primarygroup = 1100
      othergroups = [5101, 5001, 5003]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[users]]
      name = "engineer"
      givenname = "Engineer"
      sn = "User"
      mail = "engineer@local.runkora.io"
      uidnumber = 1002
      primarygroup = 1100
      othergroups = [5101, 5003, 5002]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[users]]
      name = "engineering-admin"
      givenname = "Admin"
      sn = "User"
      mail = "engineering-admin@local.runkora.io"
      uidnumber = 1003
      primarygroup = 1100
      othergroups = [5102, 5001]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[users]]
      name = "engineering-dev"
      givenname = "Dev"
      sn = "User"
      mail = "engineering-dev@local.runkora.io"
      uidnumber = 1004
      primarygroup = 1100
      othergroups = [5102, 5004, 5002]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[users]]
      name = "sre-admin"
      givenname = "Admin"
      sn = "User"
      mail = "sre-admin@local.runkora.io"
      uidnumber = 1005
      primarygroup = 1100
      othergroups = [5103, 5001]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[users]]
      name = "sre-oncall"
      givenname = "Oncall"
      sn = "User"
      mail = "sre-oncall@local.runkora.io"
      uidnumber = 1006
      primarygroup = 1100
      othergroups = [5103, 5005, 5002]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[users]]
      name = "autofix-admin"
      givenname = "Admin"
      sn = "User"
      mail = "autofix-admin@local.runkora.io"
      uidnumber = 1007
      primarygroup = 1100
      othergroups = [5104, 5001]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[users]]
      name = "autofix-maintainer"
      givenname = "Maintainer"
      sn = "User"
      mail = "autofix-maintainer@local.runkora.io"
      uidnumber = 1008
      primarygroup = 1100
      othergroups = [5104, 5006]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[users]]
      name = "oncall-admin"
      givenname = "Admin"
      sn = "User"
      mail = "oncall-admin@local.runkora.io"
      uidnumber = 1009
      primarygroup = 1100
      othergroups = [5105, 5001]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[users]]
      name = "oncall-sre"
      givenname = "SRE"
      sn = "User"
      mail = "oncall-sre@local.runkora.io"
      uidnumber = 1010
      primarygroup = 1100
      othergroups = [5105, 5005]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[users]]
      name = "feature-admin"
      givenname = "Admin"
      sn = "User"
      mail = "feature-admin@local.runkora.io"
      uidnumber = 1011
      primarygroup = 1100
      othergroups = [5106, 5001]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[users]]
      name = "feature-maintainer"
      givenname = "Maintainer"
      sn = "User"
      mail = "feature-maintainer@local.runkora.io"
      uidnumber = 1012
      primarygroup = 1100
      othergroups = [5106, 5006]
      passsha256 = "5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8"

    [[groups]]
      name = "svcaccts"
      gidnumber = 5000
    [[groups]]
      name = "users"
      gidnumber = 1100
    # platform-admin holds every scope in kora. Grant it to the people who run
    # the platform.
    [[groups]]
      name = "platform-admin"
      gidnumber = 5001
    # kora-viewer is a built-in role: it reads every agent, environment,
    # trigger and connection in the tenant, and starts nothing. kora maps the
    # group to the role by name, with no PolicyRole.
    [[groups]]
      name = "kora-viewer"
      gidnumber = 5002
    # The roles the examples define as PolicyRole resources.
    [[groups]]
      name = "engineer"
      gidnumber = 5003
    [[groups]]
      name = "reviewer"
      gidnumber = 5004
    [[groups]]
      name = "sre"
      gidnumber = 5005
    [[groups]]
      name = "maintainer"
      gidnumber = 5006
    # The tenant groups. Each tenant's claimBinding names one of them.
    [[groups]]
      name = "tenant-example"
      gidnumber = 5101
    [[groups]]
      name = "tenant-engineering"
      gidnumber = 5102
    [[groups]]
      name = "tenant-sre"
      gidnumber = 5103
    [[groups]]
      name = "tenant-autofix"
      gidnumber = 5104
    [[groups]]
      name = "tenant-oncall"
      gidnumber = 5105
    [[groups]]
      name = "tenant-feature"
      gidnumber = 5106
---
apiVersion: v1
kind: Service
metadata:
  name: glauth
  namespace: dex
spec:
  selector:
    app: glauth
  ports:
    - name: tcp-ldap
      port: 3893
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glauth
  namespace: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: glauth
  template:
    metadata:
      labels:
        app: glauth
    spec:
      containers:
        - name: glauth
          image: ghcr.io/glauth/glauth:v2.5.4
          command: [/app/glauth, -c, /etc/glauth/config.cfg]
          ports:
            - containerPort: 3893
          readinessProbe:
            tcpSocket:
              port: 3893
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/glauth
      volumes:
        - name: config
          configMap:
            name: glauth
