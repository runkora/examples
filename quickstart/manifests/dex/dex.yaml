# Dex is the OIDC provider the examples' tenants sign in with. In production
# each tenant points at your own provider, such as Okta or Entra ID. See the
# tenants folder in each example's platform repository.
#
# The issuer https://dex.local.runkora.io:5557/dex must be the same URL for the
# browser and for the identity service:
#   - The browser resolves dex.local.runkora.io to 127.0.0.1, and k3d forwards
#     port 5557 to this Service.
#   - The identity service resolves it to this Service's fixed ClusterIP through
#     identity.hostAliases in values/kora.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dex
  namespace: dex
data:
  config.yaml: |
    issuer: https://dex.local.runkora.io:5557/dex

    # Sessions are lost when Dex restarts. Sign in again if that happens.
    storage:
      type: memory

    web:
      https: 0.0.0.0:5557
      tlsCert: /etc/dex/tls/tls.crt
      tlsKey: /etc/dex/tls/tls.key
      # The console fetches Dex's discovery document and token endpoint from
      # the browser.
      allowedOrigins:
        - https://local.runkora.io:9443

    oauth2:
      deviceCodeGrant: true
      skipApprovalScreen: true
      responseTypes: [code]

    # The client the tenants' oidc.clientID refers to. It is public: the
    # console uses PKCE and holds no client secret.
    staticClients:
      - id: kora-quickstart
        name: kora quickstart
        public: true
        redirectURIs:
          - https://local.runkora.io:9443/auth/callback
          - /device/callback

    connectors:
      - type: ldap
        id: glauth
        name: Email
        config:
          host: glauth.dex.svc.cluster.local:3893
          insecureNoSSL: true
          bindDN: cn=serviceuser,dc=kora,dc=local
          bindPW: password
          userSearch:
            baseDN: dc=kora,dc=local
            filter: "(objectClass=posixAccount)"
            username: mail
            idAttr: cn
            emailAttr: mail
            nameAttr: givenName
          groupSearch:
            baseDN: dc=kora,dc=local
            filter: "(objectClass=posixGroup)"
            userMatchers:
              - userAttr: DN
                groupAttr: member
              - userAttr: cn
                groupAttr: memberUid
            nameAttr: cn
---
apiVersion: v1
kind: Service
metadata:
  name: dex
  namespace: dex
spec:
  # k3s's built-in load balancer exposes the port on the nodes, and k3d maps it
  # to port 5557 on your machine.
  type: LoadBalancer
  # A fixed address from the k3s service range (10.43.0.0/16) for identity.hostAliases.
  clusterIP: 10.43.200.10
  selector:
    app: dex
  ports:
    - name: https
      port: 5557
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: dex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1
          command: [dex, serve, /etc/dex/config.yaml]
          ports:
            - containerPort: 5557
          readinessProbe:
            httpGet:
              path: /dex/healthz
              port: 5557
              scheme: HTTPS
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/dex/config.yaml
              subPath: config.yaml
            - name: tls
              mountPath: /etc/dex/tls
      volumes:
        - name: config
          configMap:
            name: dex
        # make secrets creates this from the mkcert certificate for *.local.runkora.io.
        - name: tls
          secret:
            secretName: dex-tls
