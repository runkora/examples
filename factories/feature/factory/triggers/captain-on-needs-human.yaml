apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: captain-on-needs-human
spec:
  source: github
  eventType: pull_request
  match:
    action: [labeled]
    label.name: [needs-human]
    repository.full_name: [example-org/example-repo]
  matchContains:
    pull_request.head.ref: [feature/]
  routing:
    candidates: [captain]
    model:
      family: typesafe
      name: jev-1-14
    fallback: captain
    joinRuns: true
  promptTemplate: |
    A task pull request needs a person. Check the task and update the feature.

    Repository: {{ repository.full_name }}
    Task pull request: #{{ pull_request.number }}
    Branch: {{ pull_request.head.ref }}
    Link: {{ pull_request.html_url }}
