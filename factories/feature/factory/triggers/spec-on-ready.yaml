apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: spec-on-ready
spec:
  source: github
  eventType: issues
  match:
    action: [labeled]
    label.name: [ready-to-spec]
    repository.full_name: [example-org/example-repo]
  agent: spec-writer
  promptTemplate: |
    Write the spec for this feature request.

    Repository: {{ repository.full_name }}
    Issue: #{{ issue.number }}
    Title: {{ issue.title }}
    Link: {{ issue.html_url }}
    Body: {{ issue.body }}
