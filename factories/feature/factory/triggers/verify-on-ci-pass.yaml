apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: verify-on-ci-pass
spec:
  source: github
  eventType: workflow_run
  match:
    action: [completed]
    workflow_run.conclusion: [success]
    workflow_run.actor.login: ["example-feature[bot]"]
    repository.full_name: [example-org/example-repo]
  matchContains:
    workflow_run.head_branch: [feature/]
  coalesce:
    key: "{{ repository.full_name }}@{{ workflow_run.head_sha }}"
    windowSeconds: 60
  agent: verifier
  promptTemplate: |
    CI passed on this task pull request. Verify it against its spec.

    Repository: {{ repository.full_name }}
    Pull request: #{{ workflow_run.pull_requests.0.number }}
    Branch: {{ workflow_run.head_branch }}
    Head commit: {{ workflow_run.head_sha }}
