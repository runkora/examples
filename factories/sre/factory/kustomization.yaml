# The SRE factory: a tenant team's repository that triages alerts, sweeps the
# cluster's costs, keeps the record in GitHub issues and proposes fixes to the
# deploy repository. Point your GitOps tool at this folder, or apply it with
# kubectl apply -k.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The factory's tenant namespace. The resource files leave namespace out.
namespace: kora-tenant-oncall
commonAnnotations:
  # The console shows this value as "Managed by" on each declared item.
  runkora.io/repository: github.com/runkora/examples
# Applies the resources in the order below. The OpenCost MCPServer must exist
# before its relay pod.
sortOptions:
  order: fifo
resources:
  - shared/cluster-connection.yaml
  - shared/github-connection.yaml
  - shared/github-source.yaml
  - shared/alertmanager-source.yaml
  - shared/opencost-mcp.yaml
  - shared/ops-environment.yaml
  - shared/sre-role.yaml
  - agents/incident-triage.yaml
  - agents/remediator.yaml
  - agents/cost-sweeper.yaml
  - triggers/triage-alert.yaml
  - triggers/resolve-alert.yaml
  - triggers/remediate.yaml
  - triggers/incident-comment.yaml
  - triggers/remediator-on-review.yaml
  - triggers/sweep-weekly.yaml
