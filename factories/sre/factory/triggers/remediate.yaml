# The triage agent and the cost sweeper add the remediate label when a change
# to the deploy repository does what their issue recommends. A person can add
# it too.
apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: remediate
spec:
  source: github
  eventType: issues
  match:
    action: [labeled]
    label.name: [remediate]
    repository.full_name: [example-org/example-deploy]
  agent: remediator
  promptTemplate: |
    Make the change this issue recommends.

    Repository: {{ repository.full_name }}
    Issue: #{{ issue.number }}
    Title: {{ issue.title }}
    Link: {{ issue.html_url }}
    Body: {{ issue.body }}
