apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: remediator-on-review
spec:
  source: github
  eventType: pull_request_review
  match:
    action: [submitted]
    pull_request.user.login: ["example-sre[bot]"]
    repository.full_name: [example-org/example-deploy]
  senderRestriction:
    roles: [OWNER, MEMBER, COLLABORATOR]
  routing:
    candidates: [remediator]
    model:
      family: typesafe
      name: jev-1-14
    fallback: remediator
    joinRuns: true
  promptTemplate: |
    {{ review.user.login }} reviewed your pull request. Address the review.

    Repository: {{ repository.full_name }}
    Pull request: #{{ pull_request.number }}
    Branch: {{ pull_request.head.ref }}
    Link: {{ pull_request.html_url }}
    Review: {{ review.body }}
