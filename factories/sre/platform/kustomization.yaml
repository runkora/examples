# The platform team's repository for the SRE factory: the tenant, the models
# its agents run on and the read-only access its cluster connection has. Point
# your GitOps tool at this folder, or apply it with kubectl apply -k.
#
# These resources span kora-system and the cluster scope. This file sets no
# namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  # The console shows this value as "Managed by" on each declared item.
  runkora.io/repository: github.com/runkora/examples
resources:
  - tenants/oncall.yaml
  - cluster-access.yaml
  - models/claude-sonnet-5-5.yaml
  - models/claude-haiku-5-5.yaml
  - models/deepseek-v4-1-flash.yaml
  - models/gpt-6-luna.yaml
  - models/gpt-oss-20b.yaml
  - models/jev-1-14.yaml
