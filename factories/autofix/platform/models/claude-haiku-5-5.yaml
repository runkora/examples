# anthropic/claude-haiku-5-5 is the model the bug verifier and code reviewer run
# on. It routes to the OpenRouter provider in quickstart/providers. On your own
# cluster, point the route at a provider you registered.
apiVersion: runkora.io/v1alpha1
kind: VirtualModel
metadata:
  name: anthropic-claude-haiku-5-5
  namespace: kora-system
spec:
  family: anthropic
  name: claude-haiku-5-5
  displayName: Claude Haiku 5.5
  description: Claude Haiku 5.5 through OpenRouter.
  strategy: priority
  routes:
    - provider: compatible:openrouter
      modelID: anthropic/claude-haiku-5.5
      priority: 1
