# The sandbox the agents clone, build and test the target repository in. It
# sets the image and the size only. Each agent holds its own GitHub access.
# Set sandboxImage to the bundled image for your repository's language:
# kora-base, kora-go, kora-python or kora-node.
apiVersion: runkora.io/v1alpha1
kind: Environment
metadata:
  name: build
spec:
  displayName: Build
  description: Clones, builds and tests the target repository.
  sandboxImage: kora-base
  # Each run gets its own sandbox, capped at this size. The size fits several
  # sandboxes at once on the quickstart. Raise it for a large repository.
  size:
    cpu: 500m
    memory: 1Gi
    disk: 5Gi
