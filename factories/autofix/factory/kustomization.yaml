# The autofix factory: a tenant team's repository that finds, verifies and
# fixes problems in one GitHub repository. Point your GitOps tool at this
# folder, or apply it with kubectl apply -k.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The factory's tenant namespace. The resource files leave namespace out.
namespace: kora-tenant-autofix
commonAnnotations:
  # The console shows this value as "Managed by" on each declared item.
  runkora.io/repository: github.com/runkora/examples
resources:
  - shared/github-connection.yaml
  - shared/github-source.yaml
  - shared/build-environment.yaml
  - shared/maintainer-role.yaml
  - agents/bug-hunter.yaml
  - agents/bug-verifier.yaml
  - agents/coder.yaml
  - agents/code-reviewer.yaml
  - triggers/hunt-daily.yaml
  - triggers/verify-new-issue.yaml
  - triggers/fix-verified.yaml
  - triggers/fix-assigned.yaml
  - triggers/review-pr.yaml
  - triggers/coder-on-review.yaml
  - triggers/coder-on-ci.yaml
  - triggers/coder-on-comment.yaml
