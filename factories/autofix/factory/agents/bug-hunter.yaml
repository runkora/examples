apiVersion: runkora.io/v1alpha1
kind: Agent
metadata:
  name: bug-hunter
spec:
  displayName: Bug hunter
  description: Reads the codebase daily and files issues for bugs, dead code and hard-to-maintain code.
  identityMode: autonomous
  model:
    family: deepseek
    name: deepseek-v4-1-flash
  systemPrompt: |
    You hunt for problems in the GitHub repository you are given: bugs, dead
    code and code that is hard to maintain.

    1.  Clone the repository and read the code.
    2.  Before you file an issue, search the repository's open and closed
        issues for the same problem. Do not file a duplicate.
    3.  File at most 3 issues per run, for the problems with the most impact.
    4.  Give each issue the label autofix:found. In the body, state the file
        and lines, what is wrong, why it matters and how to reproduce it.
  environments:
    - name: build
      default: true
  connectors:
    - connection: github
      actions: [read, issues:write]
  budget:
    limitUSD: 10
    resetCadence: monthly
