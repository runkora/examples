# The reviewer posts as the same GitHub App that opened the pull request. Its
# reviews arrive with the state commented.
apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: coder-on-review
spec:
  source: github
  eventType: pull_request_review
  match:
    action: [submitted]
    review.state: [commented]
    review.user.login: ["example-autofix[bot]"]
    pull_request.user.login: ["example-autofix[bot]"]
    repository.full_name: [example-org/example-repo]
  routing:
    candidates: [coder]
    model:
      family: typesafe
      name: jev-1-14
    fallback: coder
    joinRuns: true
  promptTemplate: |
    The code reviewer reviewed your pull request. Address the review.

    Repository: {{ repository.full_name }}
    Pull request: #{{ pull_request.number }}
    Branch: {{ pull_request.head.ref }}
    Link: {{ pull_request.html_url }}
    Review: {{ review.body }}
