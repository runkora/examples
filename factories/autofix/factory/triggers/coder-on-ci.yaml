apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: coder-on-ci
spec:
  source: github
  eventType: workflow_run
  match:
    action: [completed]
    workflow_run.conclusion: [failure]
    workflow_run.actor.login: ["example-autofix[bot]"]
    repository.full_name: [example-org/example-repo]
  coalesce:
    key: "{{ repository.full_name }}@{{ workflow_run.head_sha }}"
    windowSeconds: 300
  routing:
    candidates: [coder]
    model:
      family: typesafe
      name: jev-1-14
    fallback: coder
    joinRuns: true
  promptTemplate: |
    CI failed on your pull request. Fix it.

    Repository: {{ repository.full_name }}
    Pull request: #{{ workflow_run.pull_requests.0.number }}
    Branch: {{ workflow_run.head_branch }}
    Head commit: {{ workflow_run.head_sha }}
    Failed workflow: {{ workflow_run.name }}
    Run: {{ workflow_run.html_url }}
