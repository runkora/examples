# Starts the code reviewer when the coder opens a pull request or pushes to
# one. The coder opens pull requests as the factory's GitHub App, whose user is
# <app-slug>[bot]. Pushes within two minutes start one review.
apiVersion: runkora.io/v1alpha1
kind: Trigger
metadata:
  name: review-pr
spec:
  source: github
  eventType: pull_request
  match:
    action: [opened, synchronize]
    pull_request.user.login: ["example-autofix[bot]"]
    repository.full_name: [example-org/example-repo]
  coalesce:
    key: "{{ repository.full_name }}#{{ pull_request.number }}"
    windowSeconds: 120
  agent: code-reviewer
  promptTemplate: |
    Review this pull request.

    Repository: {{ repository.full_name }}
    Pull request: #{{ pull_request.number }}
    Title: {{ pull_request.title }}
    Head commit: {{ pull_request.head.sha }}
    Link: {{ pull_request.html_url }}
    Body: {{ pull_request.body }}
